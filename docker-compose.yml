services:
  nginx:
    restart: always
    build:
      context: .
      dockerfile: NginxDockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
  backend:
    restart: always
    build:
      context: .
      dockerfile: BackendDockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
  react:
    restart: always
    build:
      context: .
      dockerfile: ReactDockerfile
    ports:
      - "5173:5173"
  mongo:
    restart: always
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
